<h1>QNAP Drive Backup</h1>
<p>QNAP Drive Backup is a personal, single-user app. It runs on its owner's home NAS and uses rclone to make a weekly, read-only backup copy of the owner's own Google Drive.</p>
<p>It is not offered to the public and has no other users.</p>
